<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add / Edit Movie</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <h1>Add / Edit Movie</h1>

    <form th:object="${movie}" th:action="@{/savemovie}" action="#" method="post">


        <input type="hidden" th:field="*{id}" />

        <p>Title: <input type="text" th:field="*{title}" />
            <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color: red"></span>
        </p>

        <p>Release year: <input type="text" th:field="*{releaseYear}" />
            <span th:if="${#fields.hasErrors('releaseYear')}" th:errors="*{releaseYear}" style="color: red"></span>
        </p>


        <p>Description:<br />
            <textarea th:field="*{description}" rows="4" cols="50"></textarea>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color: red"></span>
        </p>

        <p>Director:
            <select name="director">
                <option th:each="d : ${directors}" th:value="${d.id}" th:text="${d.name}"
                    th:selected="${movie.director != null and movie.director.id == d.id}"></option>
            </select>
            <span th:if="${#fields.hasErrors('director')}" th:errors="*{director}" style="color: red"></span>
        </p>

        <p>Genre:
            <select name="genre">
                <option th:each="g : ${genres}" th:value="${g.id}" th:text="${g.name}"
                    th:selected="${movie.genre != null and movie.genre.id == g.id}"></option>
            </select>
            <span th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}" style="color: red"></span>
        </p>

        <p>Actors (pidä Ctrl pohjassa valitaksesi useita):<br />
            <select name="actors" multiple="multiple" size="6">
                <option th:each="a : ${actors}" th:value="${a.id}" th:text="${a.name}"
                    th:selected="${#lists.contains(movie.actors.![id], a.id)}"></option>
            </select>
        </p>

        <input type="submit" value="Save" />
        <a th:href="@{/movielist}">Cancel</a>
    </form>
</body>

</html>
