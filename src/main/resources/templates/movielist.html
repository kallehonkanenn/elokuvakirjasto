<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Movies</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <h1>Movies</h1>
    <table>
        <tr>
            <th>Title</th>
            <th>Year</th>
            <th>Director</th>
            <th>Genre</th>
            <th>Actors</th>
        </tr>
        <tr th:each="movie : ${movies}">
            <td th:text="${movie.title}">title</td>
            <td th:text="${movie.releaseYear}">year</td>
            <td th:text="${movie.director.name}">director</td>
            <td th:text="${movie.genre.name}">genre</td>
            <td>
                <span th:each="actor, stat : ${movie.actors}" th:text="${actor.name + (stat.last ? '' : ', ')}"></span>
            </td>
        </tr>
    </table>
</body>

</html>
