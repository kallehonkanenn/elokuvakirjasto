<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Movies</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <h1>Movies</h1>
    <form th:action="@{/movielist}" method="get">
        <input type="text" name="q" th:value="${q}" placeholder="Search movies..." />
        <select name="by">
            <option value="title" th:selected="${by =='title'}">Title</option>
            <option value="director" th:selected="${by == 'director'}">Director</option>
            <option value="actor" th:selected="${by == 'actor'}">Actor</option>
            <option value="genre" th:selected="${by == 'genre'}">Genre</option>
        </select>
        <input type="submit" value="Search" />
        <a th:href="@{/movielist}">Clear</a>
    </form>
    <p th:if="${loggedIn}">
        <a th:href="@{/genrelist}">Genres</a> |
        <a th:href="@{/directorlist}">Directors</a> |
        <a th:href="@{/actorlist}">Actors</a>
    </p>
    <table class="table table-striped">
        <tr>
            <th>Title</th>
            <th>Year</th>
            <th>Director</th>
            <th>Genre</th>
            <th>Actors</th>
            <th th:if="${loggedIn}"></th>
            <th th:if="${loggedIn}"></th>
        </tr>
        <tr th:each="movie : ${movies}">
            <td th:text="${movie.title}">title</td>
            <td th:text="${movie.releaseYear}">year</td>
            <td th:text="${movie.director?.name}">director</td>
            <td th:text="${movie.genre?.name}">genre</td>
            <td>
                <span th:each="actor, stat : ${movie.actors}" th:text="${actor.name + (stat.last ? '' : ', ')}"></span>
            </td>
            <td th:if="${loggedIn}"><a th:href="@{/editmovie/{id}(id=${movie.id})}">Edit</a></td>
            <td th:if="${loggedIn}"><a th:href="@{/deletemovie/{id}(id=${movie.id})}"
                    onclick="return confirm('Delete this movie?')">Delete</a></td>
        </tr>
    </table>
    <p th:if="${#lists.isEmpty(movies)}"> No movies found</p>
    <p th:if="${loggedIn}"><a th:href="@{/addmovie}">Add movie</a></p>

    <p th:if="${!loggedIn}"><a th:href="@{/login}">Admin login</a></p>
    <form th:if="${loggedIn}" th:action="@{/logout}" method="post">
        <input type="submit" value="Log out" />
    </form>
</body>

</html>
